# Applied separately to observe denied -> allowed -> denied.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: reader-binding
  namespace: api-audit-lab
subjects:
  - kind: ServiceAccount
    name: reader
    namespace: api-audit-lab
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: configmap-reader

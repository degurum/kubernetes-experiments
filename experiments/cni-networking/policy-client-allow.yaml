apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: client-allow
  namespace: cni-lab
spec:
  podSelector:
    matchLabels: {role: client, access: allowed}
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector:
            matchLabels: {app: echo}
      ports:
        - protocol: TCP
          port: 8080
